<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Pet Care</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🐾 Pet Care</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Pets</a>
            <a href="care-tips.html">Care Tips</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>

        <section class="contact-section">

            <h2>Contact Us 📩</h2>

            <p>
                Have a question or want to know more about pet care?
                Feel free to contact us!
            </p>

            <form onsubmit="submitContactForm(event)">

                <label>Name:</label>
                <input type="text" id="contact-name" placeholder="Enter your name">

                <label>Email:</label>
                <input type="email" id="contact-email" placeholder="Enter your email">

                <label>Message:</label>
                <textarea id="contact-message" placeholder="Write your message"></textarea>

                <button type="submit">Send Message</button>

            </form>

            <p id="contact-result"></p>

        </section>

    </main>

    <footer>
        <p>© 2026 Pet Care Website</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
